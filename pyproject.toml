[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elo-hell"
version = "0.1.0"
description = "A small Python chess engine built for the lower circles of the rating ladder."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.999,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["elohell*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
